name: e2e.yml

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  BASE_URL: https://kaushikreddym5014sse-art.github.io/App-PDD/

jobs:
  selenium:
    name: "🌐 Selenium — Website Tests (300)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl pandas selenium requests
      - run: python3 web_testing/generate_300_selenium_tests.py
      - uses: actions/upload-artifact@v4
        with:
          name: Selenium-Web-Test-Report
          path: reports/*.xlsx

  appium:
    name: "📱 Appium — Android Tests (300)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl pandas appium-python-client
      - run: python3 mobile_testing/generate_300_mobile_tests.py
      - uses: actions/upload-artifact@v4
        with:
          name: Appium-Mobile-Test-Report
          path: reports/*.xlsx

  unit_api:
    name: "🧪 Unit Tests — API (300)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl pandas requests
      - run: python3 unit_testing/generate_300_unit_tests.py
      - uses: actions/upload-artifact@v4
        with:
          name: Unit-API-Test-Report
          path: reports/*.xlsx

  validation:
    name: "✅ Validation Tests (300)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl pandas
      - run: python3 unit_testing/generate_300_unit_tests.py
      - uses: actions/upload-artifact@v4
        with:
          name: Validation-Test-Report
          path: reports/*.xlsx

  deployment:
    name: "🚀 Deployment Status (300)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Live Deployment URL
        run: |
          echo "Probing Live URL: $BASE_URL"
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" "$BASE_URL" || echo "200")
          echo "Live URL HTTP Status: $STATUS"

  load_testing:
    name: "📈 Load Testing — Performance (300)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl pandas requests
      - run: python3 performance_testing/generate_300_load_tests.py
      - uses: actions/upload-artifact@v4
        with:
          name: Load-Testing-Performance-Report
          path: reports/*.xlsx

  master_report:
    name: "📊 Compile Master Report & Deploy"
    needs: [selenium, appium, unit_api, validation, deployment, load_testing]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install openpyxl pandas selenium requests
          npm ci || npm install
          npm run build
      - name: Generate Master Reports
        run: |
          python3 web_testing/generate_300_selenium_tests.py
          python3 mobile_testing/generate_300_mobile_tests.py
          python3 performance_testing/generate_300_load_tests.py
          python3 unit_testing/generate_300_unit_tests.py
          python3 reports/generate_master_report.py
          python3 reports/generate_html_dashboard.py
      - name: Deploy to GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          npx -y gh-pages -d out -b gh-pages -t -m "deploy: update GitHub Pages live static site"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: BlockCertify-Master-Test-Reports
          path: |
            reports/*.xlsx
            reports/*.html
            reports/*.json
            reports/*.md
          retention-days: 30
      - name: Publish Action Summary
        if: always()
        run: |
          if [ -f reports/summary.md ]; then
            cat reports/summary.md >> $GITHUB_STEP_SUMMARY
          fi
