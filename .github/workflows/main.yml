name: BlockCertify - E2E & Load Testing Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test_and_report:
    name: Run Selenium Web, Appium Mobile & 100 VU Load Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pandas selenium appium-python-client requests

      - name: Install Node Dependencies
        run: |
          npm ci || npm install

      - name: 🌐 Run Selenium Web E2E Test Suite & Generate Excel Report
        run: |
          python3 web_testing/test_web_selenium.py
          python3 web_testing/generate_web_report.py

      - name: 📱 Run Appium Mobile E2E Test Suite & Generate Excel Report
        run: |
          python3 mobile_testing/test_mobile_appium.py
          python3 mobile_testing/generate_mobile_report.py

      - name: ⚡ Run 100 VU Baseline Load Performance Test Suite & Generate Excel Report
        run: |
          python3 performance_testing/load_test_simulation.py
          python3 performance_testing/generate_load_report.py

      - name: 📊 Generate Master PDD Excel Consolidated Report
        run: |
          python3 reports/generate_master_report.py

      - name: 📦 Upload Excel Test Reports as GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BlockCertify-PDD-Excel-Test-Reports
          path: |
            reports/*.xlsx
            web_testing/*.xlsx
            mobile_testing/*.xlsx
            performance_testing/*.xlsx
          retention-days: 30
